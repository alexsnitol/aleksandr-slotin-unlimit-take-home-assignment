version: '3.8'

services:
  mongodb:
    image: mongodb/mongodb-community-server:8.0-ubi9-slim
    container_name: issue_analyzer_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: issue_analyzer
    volumes:
      - mongodb_data:/data/db
    networks:
      - issue_analyzer_network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: issue_analyzer_ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/ollama-entrypoint.sh
    networks:
      - issue_analyzer_network
    entrypoint: /bin/sh
    command: /ollama-entrypoint.sh
    healthcheck:
      test: curl -f http://localhost:11434/api/tags || exit 1
      interval: 10s
      timeout: 120s
      retries: 5
      start_period: 60s

  app:
    build: .
    container_name: issue_analyzer_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=issue-analyzer
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
      - SPRING_AI_OLLAMA_CHAT_OPTIONS_MODEL=gemma4:e4b
      - SPRING_AI_OLLAMA_CHAT_OPTIONS_TEMPERATURE=0.4
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/issue_analyzer
      - SERVER_PORT=8080
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - issue_analyzer_network

volumes:
  mongodb_data:
  ollama_data:

networks:
  issue_analyzer_network:
    driver: bridge
